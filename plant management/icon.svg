<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="50%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="50%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#b7e4c7" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle ring decoration -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(82,183,136,0.12)" stroke-width="1.5" />

  <!-- Main Sprout Group with shadow -->
  <g filter="url(#shadow)">
    <!-- Primary Large Leaf (Right) -->
    <path d="M 256 380 C 256 380 270 290 350 240 C 400 205 400 130 380 120 C 370 140 320 155 270 190 C 240 215 256 320 256 380 Z" 
          fill="url(#leafGrad1)" />

    <!-- Secondary Left Leaf -->
    <path d="M 256 380 C 256 380 245 305 180 265 C 135 235 130 170 150 160 C 160 175 200 190 235 225 C 260 255 256 330 256 380 Z" 
          fill="url(#leafGrad2)" />

    <!-- Stem -->
    <path d="M 256 410 C 256 360 254 280 264 220" 
          fill="none" stroke="#74c69d" stroke-width="10" stroke-linecap="round" />

    <!-- Dewdrop on large leaf -->
    <ellipse cx="330" cy="180" rx="10" ry="14" transform="rotate(35 330 180)" fill="#d8f3dc" opacity="0.85" />
    <circle cx="328" cy="177" r="4" fill="#ffffff" opacity="0.95" />
  </g>
</svg>